name: retry-tests

# Automatically re-runs the tests workflow once if it fails. This exists mainly
# for the self-hosted runner (a Raspberry Pi): a brief loss of contact between
# the runner and GitHub can mark an otherwise-passing job as failed. A single
# retry recovers from that transient case. A genuine test failure fails again on
# the retry and surfaces red -- it is never masked, only re-checked once.
#
# Runs on a GitHub-hosted runner, NOT the Pi, so the retry still fires when the
# Pi itself is the thing that blipped.

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed
