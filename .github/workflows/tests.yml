name: tests

# Runs the regression suite on a self-hosted runner (e.g. a Raspberry Pi, where
# the Wolfram Engine ships free and pre-licensed). The runner connects outbound
# to GitHub, so it needs no inbound access.
#
# Only triggers on the dev branch: dev holds the development layout with the
# Tests/ directory, whereas main holds the flattened, install-ready paclet and
# has no tests. A successful run here triggers deploy.yml, which builds main.
#
# Security note: self-hosted runners must NOT execute untrusted code, so this
# workflow intentionally does not trigger on pull_request (a fork PR could
# otherwise run arbitrary code on the runner).
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure TensorTools dependency is installed
        # Retry the one network-bound step so a brief GitHub blip during a fresh
        # install doesn't fail the job (already-installed runners skip the Get).
        run: |
          for attempt in 1 2 3; do
            wolframscript -code 'If[FindFile["TensorTools`"] =!= $Failed, Exit[0]]; Get["https://raw.githubusercontent.com/srossd/TensorTools/main/Install.m"]; Exit[If[FindFile["TensorTools`"] === $Failed, 1, 0]]' && exit 0
            echo "TensorTools install attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Run regression tests
        # CS_CI_LOWMEM skips the single heaviest d=6 build (<VVV>, whose exact
        # reduction peaks ~1.4 GB, above the runner's RAM; its count is still
        # checked) and clears caches between sections. Remaining ~1.1 GB spikes
        # are absorbed by swap on the runner.
        env:
          CS_CI_LOWMEM: "1"
        run: wolframscript -file Tests/RegressionTests.wls
